[tool.poetry]
name = "cycling-analytics"
version = "0.1.0"
package-mode = false
description = "Strava data analysis application"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12"

stravalib = ">=2.0"
numpy = ">=2.5.0"
pandas = ">=3.0.3"
streamlit = ">=1.58.0"
plotly = ">=6.8.0"
matplotlib = ">=3.10"
fitparse = "^1.2.0"
gpxpy = "^1.6.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"